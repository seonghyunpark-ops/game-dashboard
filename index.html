<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임 데이터 대시보드</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#1b1f24;--muted:#667085;--line:#e4e7ec;--accent:#2f6fde;--accent-soft:#e8f0fd;--ok:#12805c;--bad:#c4320a}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--panel:#1a1e24;--text:#e6e8eb;--muted:#98a2b3;--line:#2c323b;--accent:#6ea0ff;--accent-soft:#1e2a40;--ok:#4cc38a;--bad:#ff8a65}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:17px;margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:16px;max-width:1400px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:12px}
.bar label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
input,select,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;cursor:pointer}
button{cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card b{display:block;font-size:20px}
.card span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:280px 1fr;gap:12px}
@media (max-width:800px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.group-row{display:grid;grid-template-columns:1fr auto;gap:6px;padding:4px 6px;border-radius:6px;cursor:pointer;position:relative}
.group-row:hover{background:var(--accent-soft)}
.group-row .fill{position:absolute;inset:0 auto 0 0;background:var(--accent-soft);border-radius:6px;z-index:0}
.group-row>*{position:relative;z-index:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tablewrap{overflow:auto;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--ok)}
.dot.err{background:var(--bad)}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{background:var(--accent-soft);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>게임 데이터 대시보드</h1>
  <div class="tabs" id="tabs"></div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">대기</span><button id="authBtn" class="primary">Google 로그인</button></div>
</header>
<main>
  <div id="note"></div>
  <div class="bar">
    <label>검색<input id="q" placeholder="UID·이름·코드·메모"></label>
    <label>시작일<input id="from" type="date"></label>
    <label>종료일<input id="to" type="date"></label>
    <span id="catFilters" style="display:contents"></span>
    <label>분류 기준<select id="groupBy"></select></label>
    <button id="reset">필터 초기화</button>
    <button id="csv">CSV</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="cards" id="cards"></div>
  <div class="grid">
    <div class="panel"><div class="muted" id="groupTitle" style="margin-bottom:6px"></div><div id="groups"></div></div>
    <div class="panel tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
